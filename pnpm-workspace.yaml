# Workspace 中 apps 是可部署入口，packages 只保留跨运行面共享库。
packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@tsparticles/engine': true
  esbuild: true
  sharp: true
  workerd: true
# 安全约束只覆盖漏洞版本范围，其余传递依赖通过 pnpm update 正常更新锁文件。
overrides:
  "browserslist@<=4.28.6": "^4.28.7"
# pnpm 11 默认拦截发布不足 24 小时的包；本轮明确升级到 same-day latest 时只放行精确版本，避免用 minimumReleaseAge: 0 关闭整个供应链冷却期。
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.33'
  - '@ai-sdk/gateway@4.0.43'
  - '@ai-sdk/google@4.0.36'
  - '@ai-sdk/openai-compatible@3.0.25'
  - '@ai-sdk/openai@4.0.32'
  - '@ai-sdk/provider-utils@5.0.23'
  - '@ai-sdk/provider@4.0.6'
  - '@aws-sdk/client-s3@3.1104.0'
  - '@redocly/cli@2.45.0'
  - ai@7.0.55
  - lucide-react@1.29.0
  - tsx@4.23.9
  # 仅目标 Wrangler 和其官方 Miniflare 依赖未满 24 小时；workerd/类型仍走默认冷却期，不放行整个命名空间。
  - wrangler@4.149.0
  - miniflare@5.20261006.1-alpha
  # 工程优化已审计并指定Vite版本；仅放行该版本的发布冷却期，不扩大后续升级范围。
  - vite@8.3.4
